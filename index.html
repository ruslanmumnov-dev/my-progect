<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#1c2b24;--mute:#66756d;--line:#dbe1dc;--acc:#1f6f4a;--accInk:#fff;--now:#e8f3ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1a251f;--ink:#e9f0ec;--mute:#93a39a;--line:#2a3a31;--acc:#4fc58a;--accInk:#0c1a13;--now:#203528}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1a251f;--ink:#e9f0ec;--mute:#93a39a;--line:#2a3a31;--acc:#4fc58a;--accInk:#0c1a13;--now:#203528}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.hero{background:var(--acc);color:var(--accInk);border-radius:18px;padding:20px;margin-bottom:14px}
.hero small{opacity:.85;font-size:14px}
.hero .t{font-size:24px;font-weight:700;margin:4px 0}
.hero .r{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.hero .m{margin-top:6px;font-size:15px;opacity:.95}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button.p{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px}
#st{color:var(--mute);font-size:14px}
#alert{display:none;background:#ffd9a8;color:#3a2200;border-radius:12px;padding:14px;margin-bottom:14px;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.tabs button{padding:9px 4px;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row.now{background:var(--now);border-color:var(--acc)}
.row .tm{min-width:58px;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.row .nm{flex:1;font-weight:600}
.row .au{font-weight:700;color:var(--acc);white-space:nowrap}
.empty{color:var(--mute);padding:18px;text-align:center}
</style>
</head>
<body>
<main>
<div class="hero" aria-live="polite">
<small id="hl">Сейчас</small>
<div class="t" id="ht">—</div>
<div class="r" id="hr"></div>
<div class="m" id="hm"></div>
</div>
<div id="alert" role="alert"></div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
</main>
<script>
var D=["Якшанбе","Душанбе","Сешанбе","Чоршанбе","Панчшанбе","Чумъа","Шанбе"];
var S={
1:[["12:00","12:50","Лекция/амали Руси","0/001"],["13:00","13:50","Лекция Физика","410"],["14:00","14:50","Лекция Физика","410"],["15:00","15:50","Амали Алгебра","308"],["16:00","16:50","Лекция Почаев/КМРО","410"]],
2:[["12:00","12:50","Лекция Почоев","410"],["13:00","13:50","Озмоиши Почоев","508"],["14:00","14:50","Озмоиши Почоев","508"],["13:00","13:50","Семенари Куратори","308"]],
3:[["12:00","12:50","Амали физика / Рахмонов","401"],["13:00","13:50","Лекция Асосхои барномасози","423"],["14:00","14:50","Амали Асосхои барномасози","508"]],
4:[["12:00","12:50","Амали /Забони руси","0/319"],["13:00","13:50"," Лекция Фархангшиноси","001"],["14:00","14:50","Чисмони","Т/В"],["15:00","15:50"," Амали / Забони руси  ","113"],["16:00","16:50","Чисмони","Т/В"]],
5:[["12:00","12:50","Лекция Алгебра","423"],["13:00","13:50","Семенари Фархангшиноси","309"],["14:00","14:50","Озмоиши / Физика","002"],["15:00","15:50","Озмоиши / Физика","002"]],
6:[["12:00","12:50","Лекция Забони барномасози","410"],["13:00","13:50","Озмоиши / Забони барномасози","415"],["14:00","14:50","Озмоиши / Забони барномасози","415"]],
};
var $=function(i){return document.getElementById(i)};
var sel=new Date().getDay();var fired={};
function mins(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function lead(){return 10}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(function(){o.stop();c.close()},500)}catch(e){}}
function notify(title,body){
 var a=$("alert");a.textContent=title+" — "+body;a.style.display="block";
 beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
 try{if("Notification" in window&&Notification.permission==="granted")new Notification(title,{body:body})}catch(e){}
}
function renderTabs(){
 var h="";[1,2,3,4,5,6].forEach(function(d){h+='<button aria-pressed="'+(d===sel)+'" data-d="'+d+'">'+D[d]+'</button>'});
 $("tabs").innerHTML=h;
 Array.prototype.forEach.call($("tabs").children,function(b){b.onclick=function(){sel=+b.dataset.d;renderTabs();renderList()}});
}
function renderList(){
 var now=new Date(),nm=now.getHours()*60+now.getMinutes(),today=now.getDay(),L=S[sel]||[],h="";
 if(!L.length)h='<div class="empty">В этот день занятий нет</div>';
 L.forEach(function(x){
  var on=sel===today&&nm>=mins(x[0])&&nm<mins(x[1])+1;
  h+='<div class="row'+(on?" now":"")+'"><div class="tm">'+x[0]+"–"+x[1]+'</div><div class="nm">'+x[2]+'</div><div class="au">ауд. '+x[3]+'</div></div>';
 });
 $("list").innerHTML=h;
}
function nextLesson(now){
 var nm=now.getHours()*60+now.getMinutes();
 for(var k=0;k<7;k++){
  var d=(now.getDay()+k)%7,L=S[d]||[];
  for(var i=0;i<L.length;i++){
   var st=mins(L[i][0]);
   if(k>0||st>nm)return {x:L[i],day:k,diff:k*1440+st-nm};
  }
 }
 return null;
}
function tick(){
 var now=new Date(),nm=now.getHours()*60+now.getMinutes(),L=S[now.getDay()]||[],cur=null;
 L.forEach(function(x){if(nm>=mins(x[0])&&nm<=mins(x[1]))cur=x});
 var n=nextLesson(now);
 if(cur){$("hl").textContent="Идёт сейчас";$("ht").textContent=cur[2];$("hr").textContent="ауд. "+cur[3];$("hm").textContent="до "+cur[1]}
 else if(n){
  var w=n.diff>=60?Math.floor(n.diff/60)+" ч "+(n.diff%60)+" мин":n.diff+" мин";
  $("hl").textContent="Дальше"+(n.day?" ("+D[(now.getDay()+n.day)%7]+")":"");
  $("ht").textContent=n.x[2];$("hr").textContent="ауд. "+n.x[3];$("hm").textContent="в "+n.x[0]+" · через "+w;
 }
 L.forEach(function(x){
  var diff=mins(x[0])-nm,key=now.toDateString()+x[0];
  if(diff>=0&&diff<=lead()&&!fired[key]){fired[key]=1;notify(x[2]+" — ауд. "+x[3],"Начало в "+x[0]+(diff?" (через "+diff+" мин)":" (сейчас)"))}
 });
 renderList();
}
$("alert").onclick=function(){this.style.display="none"};
renderTabs();tick();
setInterval(tick,15000);
</script>
</body>
</html>
